manifestVersion: 1

package:
  name: robonix.skill.write_text
  version: 0.1.0
  description: XYZ 三轴写字机文本技能 — 基于 vendored 单笔画字体的中英文书写。
  tags: [skill, plot, write, text, xyz]
  maintainers:
    - shadosider <1439107161@qq.com>
    - MuoTT <muott0927@gmail.com>
  license: MIT

build: bash scripts/build.sh
start: bash scripts/start.sh

# Package-local contracts: this skill owns only the text surface.
# The primitive contracts mirrored under capabilities/primitive/ are
# consumed but NOT listed here — they exist only so rbnx codegen emits
# the gRPC stubs this skill calls.
capabilities:
  - name: robonix/skill/text/driver
  - name: robonix/skill/text/write_text

depends: []