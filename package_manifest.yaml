manifestVersion: 1

package:
  name: robonix.skill.write_text
  version: 0.1.0
  description: Write text on a 3-axis Cartesian plotter using stroke-based fonts for Chinese and English.
  tags: [skill, plot, write, text, xyz]
  maintainers:
    - shadosider <1439107161@qq.com>
    - MuoTT <muott0927@gmail.com>
  license: MIT

build: bash scripts/build.sh
start: bash scripts/start.sh

# Package-local contracts: this skill owns only the write_text surface.
# The primitive contracts mirrored under capabilities/primitive/ are
# consumed but NOT listed here — they exist only so rbnx codegen emits
# the gRPC stubs this skill calls.
capabilities:
  - name: robonix/skill/write_text/driver
    path: capabilities/driver.v1.toml
    transport: grpc
  - name: robonix/skill/write_text/write
    path: capabilities/write.v1.toml
    transport: mcp

depends: []